  <div class="main-container" [class.is-mobile]="isMobile()">

      <mat-toolbar class="container-toolbar">
        <button matIconButton (click)="snav.toggle()"><mat-icon>menu</mat-icon></button>
        <h1 class="app-name">ComptaPoc</h1>
        <div class="H-divider" role="separator" aria-label="Divider"></div>
      </mat-toolbar>

      <mat-sidenav-container class="sidenav-container"
                            [style.marginTop.px]="isMobile() ? 56 : 0">
        <mat-sidenav #snav [mode]="isMobile() ? 'over' : 'side'"
                    [fixedInViewport]="isMobile()" fixedTopGap="56">
          <mat-nav-list>
            <app-navbar />
          </mat-nav-list>
        </mat-sidenav>

        <mat-sidenav-content>
          <router-outlet />
        </mat-sidenav-content>

      </mat-sidenav-container>

    </div>
