
<mat-card appearance="outlined">
    <div class="container">
        <button mat-stroked-button color="primary" (click)="onShowForm('Création d\'un nouveau compte', showForm)">Créer un nouveau compte</button>
        @if( showForm ) {
        <button mat-stroked-button color="primary" (click)="onShowForm('Création d\'un nouveau compte')">
                Annuler
        </button>
        }
        @if( showForm ) {
            <app-financial-account-form [formTitle]=formTitle [accountForUpdate]= accountForUpdate />  
        }
    </div>
</mat-card>

<mat-card appearance="outlined">
    <h2> Liste des comptes </h2>
    <table mat-table [dataSource]="financialAccounts()" multiTemplateDataRows class="mat-shadow-2">

        <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef> Code </th>
            <td mat-cell *matCellDef="let account"> {{account.code}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let account"> {{account.name}} </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell [attr.rowspan]="2" *matCellDef="let account" class="lastRow lastCol"> 
                <button mat-stroked-button color="primary" routerLink="/account-details/{{account.id }}">Ouvrir</button>
                <button mat-stroked-button color="primary" (click)="onShowForm('Editer un compte', true, account)" >Editer</button>
            </td>
        </ng-container>

        <!-- Secondary Column -->
        <ng-container matColumnDef="secondary">
        <td mat-cell [attr.colspan]="displayedColumns.length-1" *matCellDef="let account">
            TT crédits: {{ giveTotalOfCredits(account)}} 
            TT debits: {{ giveTotalOfDebits(account)}} 
            Bilan: {{ giveTotalOfCredits(account) - giveTotalOfDebits(account)}} 
        </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr mat-row *matRowDef="let row; columns: ['secondary'];"  class="lastRow"></tr>

    </table>  
</mat-card>
